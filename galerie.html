<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galerie | Styrian Bastards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#ffffff;
    font-family:'Oswald', Arial, sans-serif;
    overflow-x:hidden;
}

.hero{
    position:relative;
    width:100%;
    min-height:100vh;
    background:
        linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.88)),
        url("hero.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:160px 24px 90px;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.78) 100%);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
}

.hero h1{
    font-family:'Cinzel', serif;
    font-size:clamp(3.4rem, 8vw, 7rem);
    letter-spacing:8px;
    text-transform:uppercase;
    line-height:1;
    margin-bottom:24px;
    text-shadow:0 0 30px rgba(0,0,0,0.9);
}

.hero p{
    font-size:1.25rem;
    color:rgba(255,255,255,0.82);
    letter-spacing:3px;
    text-transform:uppercase;
}

.gallery-section{
    padding:100px 35px 120px;
    background:
        radial-gradient(circle at top, rgba(179,0,24,0.12), transparent 38%),
        #050505;
}

.gallery-wrap{
    max-width:1500px;
    margin:0 auto;
}

.section-title{
    text-align:center;
    font-size:clamp(2.6rem, 5vw, 4.5rem);
    margin-bottom:22px;
    letter-spacing:6px;
    text-transform:uppercase;
}

.section-intro{
    text-align:center;
    max-width:760px;
    margin:0 auto 60px;
    color:rgba(255,255,255,0.7);
    line-height:1.7;
    font-size:1.05rem;
}

.gallery-status{
    text-align:center;
    color:rgba(255,255,255,0.65);
    padding:35px 20px;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    background:rgba(255,255,255,0.03);
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:22px;
}

.gallery-item{
    position:relative;
    overflow:hidden;
    min-height:290px;
    border-radius:14px;
    background:#111;
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
}

.gallery-item:nth-child(6n+1),
.gallery-item:nth-child(6n+6){
    grid-column:span 6;
    min-height:430px;
}

.gallery-item:nth-child(6n+2),
.gallery-item:nth-child(6n+5){
    grid-column:span 4;
}

.gallery-item:nth-child(6n+3),
.gallery-item:nth-child(6n+4){
    grid-column:span 3;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:0.45s ease;
    filter:grayscale(18%) contrast(1.08);
}

.gallery-item:hover img{
    transform:scale(1.07);
    filter:grayscale(0%) contrast(1.15);
}

.gallery-overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:28px 24px;
    background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.gallery-overlay h3{
    font-size:1.25rem;
    letter-spacing:2px;
    text-transform:uppercase;
}

.gallery-overlay span{
    display:block;
    margin-top:5px;
    color:rgba(255,255,255,0.62);
}

.lightbox{
    position:fixed;
    inset:0;
    z-index:999999;
    background:rgba(0,0,0,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:94vw;
    max-height:86vh;
    object-fit:contain;
    border-radius:12px;
    box-shadow:0 20px 80px rgba(0,0,0,0.8);
}

.lightbox-close{
    position:fixed;
    top:26px;
    right:30px;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:2rem;
    cursor:pointer;
}

.lightbox-close:hover{
    background:#b30018;
}

@media(max-width:1000px){
    .gallery-item:nth-child(n){
        grid-column:span 6;
    }
}

@media(max-width:650px){
    .hero{
        padding-top:190px;
    }

    .hero h1{
        letter-spacing:4px;
    }

    .gallery-section{
        padding:80px 18px 100px;
    }

    .gallery-grid{
        gap:16px;
    }

    .gallery-item:nth-child(n){
        grid-column:span 12;
        min-height:280px;
    }
}
</style>
</head>

<body>

<div id="navbar"></div>

<section class="hero">
    <div class="hero-content">
        <h1>Galerie</h1>
        <p>Leidenschaft • Gemeinschaft • Hockey</p>
    </div>
</section>

<section class="gallery-section" id="galerie">
    <div class="gallery-wrap">

        <h2 class="section-title">Momente</h2>

        <p class="section-intro">
            Bilder, Eindrücke und Erinnerungen rund um die Styrian Bastards,
            den ATSE Graz Hockey und unsere gemeinsamen Veranstaltungen.
        </p>

        <div id="galleryStatus" class="gallery-status">
            Galerie wird geladen …
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>

    </div>
</section>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Bild schließen">&times;</button>
    <img id="lightboxImage" src="" alt="Galerie Bild groß">
</div>

<div id="footer"></div>

<script>
const CLOUD_NAME = "dmixb4gsg";
const GALLERY_TAG = "stb-galerie";

fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar').innerHTML = data;
    });

fetch('footer.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('footer').innerHTML = data;
    });

function buildImageUrl(publicId, width = 900) {
    return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto,w_${width},c_fill/${publicId}`;
}

function buildFullImageUrl(publicId) {
    return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto/${publicId}`;
}

async function loadGallery() {
    const status = document.getElementById('galleryStatus');
    const grid = document.getElementById('galleryGrid');

    try {
        const listUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${GALLERY_TAG}.json?v=${Date.now()}`;
        const response = await fetch(listUrl);

        if(!response.ok) {
            throw new Error('Cloudinary-Liste konnte nicht geladen werden.');
        }

        const data = await response.json();
        const resources = data.resources || [];

        if(resources.length === 0) {
            status.innerHTML = 'Noch keine Bilder in der Galerie vorhanden.';
            return;
        }

        status.style.display = 'none';

        resources
            .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''))
            .forEach((item, index) => {
                const publicId = item.public_id;
                const title = item.context?.custom?.caption || item.context?.caption || 'Styrian Bastards';
                const subtitle = item.context?.custom?.alt || 'Galerie';

                const card = document.createElement('div');
                card.className = 'gallery-item';
                card.dataset.full = buildFullImageUrl(publicId);

                card.innerHTML = `
                    <img src="${buildImageUrl(publicId)}" alt="${title}">
                    <div class="gallery-overlay">
                        <h3>${title}</h3>
                        <span>${subtitle}</span>
                    </div>
                `;

                grid.appendChild(card);
            });

        activateLightbox();

    } catch(error) {
        status.innerHTML = `
            Die Galerie konnte noch nicht geladen werden.<br>
            Prüfe bitte in Cloudinary, ob <strong>Resource List</strong> erlaubt ist
            und ob die Bilder den Tag <strong>${GALLERY_TAG}</strong> haben.
        `;
        console.error(error);
    }
}

function activateLightbox() {
    document.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('click', () => {
            document.getElementById('lightboxImage').src = item.dataset.full;
            document.getElementById('lightbox').classList.add('active');
        });
    });
}

document.getElementById('lightboxClose').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightboxImage').src = '';
});

document.getElementById('lightbox').addEventListener('click', event => {
    if(event.target.id === 'lightbox') {
        document.getElementById('lightbox').classList.remove('active');
        document.getElementById('lightboxImage').src = '';
    }
});

document.addEventListener('keydown', event => {
    if(event.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('active');
        document.getElementById('lightboxImage').src = '';
    }
});

loadGallery();
</script>

</body>
</html>
