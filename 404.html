<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Seite nicht gefunden | Styrian Bastards</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#050505;
            color:#ffffff;
            font-family:'Oswald', Arial, sans-serif;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            overflow:hidden;
            position:relative;
        }

        .background{
            position:absolute;
            inset:0;

            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
                url('https://images.unsplash.com/photo-1515703407324-5f753afd8be8?q=80&w=1920&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            transform:scale(1.05);
        }

        .content{
            position:relative;
            z-index:2;

            text-align:center;

            max-width:850px;
            padding:40px 25px;
        }

        .error-code{
            font-size:clamp(5rem, 14vw, 11rem);
            font-weight:700;
            line-height:1;
            color:#ffffff;

            text-shadow:0 0 25px rgba(179,0,24,0.45);

            margin-bottom:18px;
        }

        .title{
            font-size:clamp(2rem, 5vw, 4rem);
            text-transform:uppercase;
            letter-spacing:2px;

            margin-bottom:20px;
        }

        .text{
            color:rgba(255,255,255,0.8);

            font-size:1.15rem;
            line-height:1.7;

            margin-bottom:40px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:18px;
            flex-wrap:wrap;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;

            min-width:220px;

            padding:15px 28px;

            border-radius:12px;

            text-decoration:none;

            text-transform:uppercase;
            letter-spacing:1px;
            font-weight:600;

            transition:0.25s ease;
        }

        .btn-primary{
            background:#b30018;
            color:#ffffff;
        }

        .btn-primary:hover{
            background:#d1001c;
            transform:translateY(-2px);
        }

        .btn-secondary{
            border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.04);
            color:#ffffff;
        }

        .btn-secondary:hover{
            background:rgba(255,255,255,0.08);
            transform:translateY(-2px);
        }

        .footer-note{
            margin-top:55px;

            color:rgba(255,255,255,0.45);

            font-size:0.95rem;
            letter-spacing:1px;
        }

        @media (max-width:700px){

            .text{
                font-size:1rem;
            }

            .buttons{
                flex-direction:column;
            }

            .btn{
                width:100%;
            }
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <main class="content">

        <div class="error-code">404</div>

        <h1 class="title">
            Diese Seite existiert nicht
        </h1>

        <p class="text">
            Die gesuchte Seite konnte leider nicht gefunden werden.
            Vielleicht wurde sie verschoben, gelöscht oder der Link ist falsch.
        </p>

        <div class="buttons">

            <a href="index.html" class="btn btn-primary">
                Zur Startseite
            </a>

            <a href="mitglied-werden.html" class="btn btn-secondary">
                Mitglied werden
            </a>

        </div>

        <div class="footer-note">
            STYRIAN BASTARDS • OFFIZIELLER FANCLUB DES ATSE GRAZ HOCKEY
        </div>

    </main>

</body>
</html>
