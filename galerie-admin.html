<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galerie Upload | Styrian Bastards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#ffffff;
    font-family:'Oswald', Arial, sans-serif;
    min-height:100vh;
}

.admin-page{
    min-height:100vh;
    padding:170px 24px 90px;
    background:
        linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.92)),
        url("hero.jpg");
    background-size:cover;
    background-position:center;
}

.admin-box{
    max-width:850px;
    margin:0 auto;
    background:rgba(5,5,5,0.88);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:22px;
    padding:38px;
    box-shadow:0 20px 80px rgba(0,0,0,0.55);
    backdrop-filter:blur(10px);
}

h1{
    font-family:'Cinzel', serif;
    font-size:clamp(2.4rem, 6vw, 4.6rem);
    text-transform:uppercase;
    letter-spacing:3px;
    margin-bottom:16px;
}

.intro{
    color:rgba(255,255,255,0.72);
    line-height:1.7;
    margin-bottom:34px;
}

.form-row{
    margin-bottom:22px;
}

label{
    display:block;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:0.92rem;
    margin-bottom:8px;
    color:rgba(255,255,255,0.82);
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:14px 15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.06);
    color:#ffffff;
    font-family:'Oswald', Arial, sans-serif;
    font-size:1rem;
}

input[type="file"]::file-selector-button{
    background:#b30018;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    margin-right:14px;
    cursor:pointer;
    font-family:'Oswald', Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
}

button{
    width:100%;
    padding:15px 22px;
    border:none;
    border-radius:12px;
    background:#b30018;
    color:#ffffff;
    font-family:'Oswald', Arial, sans-serif;
    font-size:1.05rem;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.25s ease;
}

button:hover{
    background:#d1001c;
    transform:translateY(-2px);
}

button:disabled{
    opacity:0.55;
    cursor:not-allowed;
    transform:none;
}

.status{
    margin-top:24px;
    padding:18px;
    border-radius:12px;
    background:rgba(255,255,255,0.06);
    color:rgba(255,255,255,0.82);
    line-height:1.6;
    display:none;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:14px;
    margin-top:24px;
}

.preview-grid img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);
}

.note{
    margin-top:28px;
    color:rgba(255,255,255,0.55);
    line-height:1.6;
    font-size:0.95rem;
}
</style>
</head>

<body>

<div id="navbar"></div>

<main class="admin-page">
    <div class="admin-box">
        <h1>Galerie Upload</h1>

        <p class="intro">
            Hier kannst du Bilder für die Styrian-Bastards-Galerie hochladen.
            Nach dem Upload erscheinen sie automatisch auf der Galerie-Seite.
        </p>

        <form id="uploadForm">
            <div class="form-row">
                <label for="title">Titel für die Bilder</label>
                <input type="text" id="title" placeholder="z. B. Cornhole Turnier">
            </div>

            <div class="form-row">
                <label for="subtitle">Beschreibung / Kategorie</label>
                <input type="text" id="subtitle" placeholder="z. B. Events, Auswärtsfahrt, ATSE Support">
            </div>

            <div class="form-row">
                <label for="files">Bilder auswählen</label>
                <input type="file" id="files" accept="image/*" multiple required>
            </div>

            <button type="submit" id="uploadButton">Bilder hochladen</button>
        </form>

        <div class="status" id="status"></div>
        <div class="preview-grid" id="previewGrid"></div>

        <p class="note">
            Wichtig: Diese Seite sollte später über Cloudflare Access geschützt werden,
            damit nur berechtigte Personen Bilder hochladen können.
        </p>
    </div>
</main>

<div id="footer"></div>

<script>
const CLOUD_NAME = "dmixb4gsg";
const UPLOAD_PRESET = "STB Galerie";
const GALLERY_TAG = "stb-galerie";

fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar').innerHTML = data;
    });

fetch('footer.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('footer').innerHTML = data;
    });

const form = document.getElementById('uploadForm');
const statusBox = document.getElementById('status');
const previewGrid = document.getElementById('previewGrid');
const uploadButton = document.getElementById('uploadButton');

function showStatus(message) {
    statusBox.style.display = 'block';
    statusBox.innerHTML = message;
}

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const files = document.getElementById('files').files;
    const title = document.getElementById('title').value.trim() || 'Styrian Bastards';
    const subtitle = document.getElementById('subtitle').value.trim() || 'Galerie';

    if(!files.length) {
        showStatus('Bitte zuerst mindestens ein Bild auswählen.');
        return;
    }

    uploadButton.disabled = true;
    previewGrid.innerHTML = '';
    showStatus(`Upload gestartet: ${files.length} Bild(er) …`);

    let success = 0;
    let failed = 0;

    for(const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        formData.append('tags', GALLERY_TAG);
        formData.append('folder', 'styrian-bastards/galerie');
        formData.append('context', `caption=${title}|alt=${subtitle}`);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if(!response.ok) {
                console.error(data);
                failed++;
                continue;
            }

            success++;

            const img = document.createElement('img');
            img.src = data.secure_url;
            img.alt = title;
            previewGrid.appendChild(img);

            showStatus(`Upload läuft … erfolgreich: ${success}, fehlgeschlagen: ${failed}`);

        } catch(error) {
            console.error(error);
            failed++;
            showStatus(`Upload läuft … erfolgreich: ${success}, fehlgeschlagen: ${failed}`);
        }
    }

    uploadButton.disabled = false;
    showStatus(`
        Upload abgeschlossen.<br>
        Erfolgreich: <strong>${success}</strong><br>
        Fehlgeschlagen: <strong>${failed}</strong><br><br>
        Hinweis: Die Galerie-Liste bei Cloudinary kann bis zu ca. 60 Sekunden brauchen,
        bis neue Bilder sichtbar sind.
    `);

    form.reset();
});
</script>

</body>
</html>
