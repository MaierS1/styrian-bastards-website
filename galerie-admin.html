<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">

<title>Galerie Upload | Styrian Bastards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/consent-manager.css">
<link rel="stylesheet" href="/css/extracted/galerie-admin.css">
</head>

<body>

<div id="navbar"></div>

<main class="admin-page">
    <div class="admin-box">
        <h1>Galerie Upload</h1>

        <p class="intro">
            Hier kannst du Bilder für die Styrian-Bastards-Galerie hochladen.
            Nach dem Upload erscheinen sie automatisch auf der Galerie-Seite.
        </p>

        <form id="uploadForm">
            <div class="form-row">
                <label for="title">Titel für die Bilder</label>
                <input type="text" id="title" placeholder="z. B. Cornhole Turnier">
            </div>

            <div class="form-row">
                <label for="subtitle">Beschreibung / Kategorie</label>
                <input type="text" id="subtitle" placeholder="z. B. Events, Auswärtsfahrt, ATSE Support">
            </div>

            <div class="form-row">
                <label for="files">Bilder auswählen</label>
                <input type="file" id="files" accept="image/*" multiple required>
            </div>

            <button type="submit" id="uploadButton">Bilder hochladen</button>
        </form>

        <div class="status" id="status"></div>
        <div class="preview-grid" id="previewGrid"></div>

        <p class="note">
            Wichtig: Diese Seite sollte später über Cloudflare Access geschützt werden,
            damit nur berechtigte Personen Bilder hochladen können.
        </p>
    </div>
</main>

<div id="footer"></div>

<script src="/js/extracted/galerie-admin.js"></script>

<script src="/js/consent-manager.js" defer></script>

</body>
</html>
